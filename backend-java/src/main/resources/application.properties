# Social Network Java Backend
# Port 4000 matches the Node.js server so the frontend HTML works unchanged
server.port=4000

# Allow the standalone HTML frontend (different port or even file://) to call this API
spring.mvc.cors.allowed-origin-patterns=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.exposed-headers=*
spring.mvc.cors.max-age=3600

# Jackson — output pretty-printed JSON (matches Node.js JSON format)
spring.jackson.serialization.indent-output=false
